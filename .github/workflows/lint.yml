name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # helm is preinstalled on GitHub-hosted Ubuntu runners
      - name: Lint and render the chart
        run: |
          for args in "" "--set watchNamespaces={games,other}" "--set clusterPolicy.enabled=true --set clusterPolicy.spec.maxServersPerNamespace=2"; do
            echo "::group::helm $args"
            helm lint --strict dist/chart $args
            helm template sat dist/chart $args > /dev/null
            echo "::endgroup::"
          done
