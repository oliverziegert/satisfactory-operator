name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Regenerate code and tidy modules
        run: make manifests generate helm && go mod tidy

      - name: Check for stale generated files
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Running Tests
        run: make test
