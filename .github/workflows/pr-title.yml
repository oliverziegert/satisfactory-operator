name: PR Title

# pull_request_target also covers fork PRs; safe because no PR code is checked out.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
