# Sample Secret containing the admin password for the Satisfactory Dedicated Server API.
# The controller reads the "password" key when adminPasswordSecretRef is configured on
# a SatisfactoryServer resource.
#
# Usage:
#   kubectl create secret generic my-satisfactory-server-admin \
#     --from-literal=password='<your-admin-password>'
#
# Or apply this manifest after replacing the placeholder value:
apiVersion: v1
kind: Secret
metadata:
  name: my-satisfactory-server-admin
  namespace: default
stringData:
  password: "change-me"
