{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.23.0
  name: savegames.satisfactory.oliverziegert.github.com
spec:
  group: satisfactory.oliverziegert.github.com
  names:
    kind: SaveGame
    listKind: SaveGameList
    plural: savegames
    singular: savegame
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef
      name: Server
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastBackupTime
      name: Last Backup
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SaveGame is the Schema for the savegames API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SaveGameSpec defines the desired state of SaveGame.
            properties:
              destinations:
                description: |-
                  Destinations are where each backup is written. Empty means [{name: server, server: {}}],
                  which keeps the save on the game server only.
                items:
                  description: SaveGameDestination is a named backup destination.
                    Exactly one type field must be set.
                  properties:
                    name:
                      description: Name identifies the destination in status. It must
                        be a DNS label.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    pvc:
                      description: PVC writes saves to an existing PersistentVolumeClaim
                        in the SaveGame's namespace.
                      properties:
                        claimName:
                          description: ClaimName is the name of the PersistentVolumeClaim
                            in the SaveGame's namespace.
                          maxLength: 253
                          minLength: 1
                          type: string
                        path:
                          description: |-
                            Path is an optional subdirectory on the claim. It must be relative and must not
                            contain ".." segments. It is created if missing.
                          maxLength: 256
                          type: string
                          x-kubernetes-validations:
                          - message: path must be relative
                            rule: '!self.startsWith(''/'')'
                          - message: path must not contain '..' segments
                            rule: '!self.split(''/'').exists(s, s == ''..'')'
                      required:
                      - claimName
                      type: object
                    retentionPolicy:
                      description: RetentionPolicy overrides spec.retentionPolicy
                        for this destination.
                      properties:
                        maxAge:
                          description: |-
                            MaxAge is the maximum age of save files to retain (e.g. "72h").
                            Save files older than this duration are deleted.
                          type: string
                        maxCount:
                          description: |-
                            MaxCount is the maximum number of save files to retain.
                            Older saves are deleted when this limit is exceeded.
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                    server:
                      description: Server keeps the save on the game server.
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one destination type must be set
                    rule: '[has(self.server), has(self.pvc)].filter(x, x).size() ==
                      1'
                  - message: pvc destination names must be at most 58 characters (the
                      Job volume is dest-<name>)
                    rule: '!has(self.pvc) || size(self.name) <= 58'
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: at most one server destination is allowed
                  rule: self.filter(d, has(d.server)).size() <= 1
              retentionPolicy:
                description: RetentionPolicy defines how many save files to keep and
                  for how long.
                properties:
                  maxAge:
                    description: |-
                      MaxAge is the maximum age of save files to retain (e.g. "72h").
                      Save files older than this duration are deleted.
                    type: string
                  maxCount:
                    description: |-
                      MaxCount is the maximum number of save files to retain.
                      Older saves are deleted when this limit is exceeded.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              saveName:
                description: |-
                  SaveName is the name of the save game file on the server.
                  The server may sanitize the name to satisfy filesystem restrictions.
                type: string
              schedule:
                description: |-
                  Schedule is a cron expression for automated backups (e.g. "0 * * * *" for hourly).
                  If empty, no automated backups are performed.
                type: string
              serverRef:
                description: |-
                  ServerRef is the name of the SatisfactoryServer resource this SaveGame belongs to.
                  Must be in the same namespace.
                type: string
            required:
            - saveName
            - serverRef
            type: object
          status:
            description: SaveGameStatus defines the observed state of SaveGame.
            properties:
              backupSize:
                description: BackupSize is the size of the most recent backup file
                  in bytes.
                format: int64
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the SaveGame's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              destinations:
                description: Destinations holds the per-destination results of the
                  latest backup run.
                items:
                  description: SaveGameDestinationStatus is the outcome of the latest
                    backup run for one destination.
                  properties:
                    lastError:
                      description: LastError is the error of the latest run, empty
                        if it succeeded.
                      type: string
                    lastSize:
                      description: LastSize is the size in bytes of the save written
                        by the latest successful run.
                      format: int64
                      type: integer
                    lastSuccessTime:
                      description: LastSuccessTime is the time of the latest run that
                        wrote to this destination.
                      format: date-time
                      type: string
                    name:
                      description: Name is the destination name from spec.destinations.
                      type: string
                    retainedCount:
                      description: RetainedCount is the number of saves this destination
                        holds for the session.
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lastBackupTime:
                description: LastBackupTime is the timestamp of the most recent successful
                  backup.
                format: date-time
                type: string
              nextBackupTime:
                description: NextBackupTime is when the next scheduled backup will
                  occur.
                format: date-time
                type: string
              phase:
                description: Phase is the current lifecycle phase of the save game
                  operation.
                enum:
                - Pending
                - Active
                - Completed
                - Failed
                type: string
              retainedSaveCount:
                description: RetainedSaveCount is the number of save files on the
                  server belonging to this SaveGame.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
